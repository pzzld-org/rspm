[workspace]
default-members = [
  "crates/rspm",
]
exclude = ["patches/polymarket_client_sdk_v2"]
members = [
  "crates/*",
]
resolver = "3"

[workspace.package]
authors = ["FL03 <joe@pzzld.org>"]
categories = []
description = "A client library for interacting with Polymarket."
edition = "2024"
homepage = "https://github.com/FL03/rspm/wiki"
keywords = []
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/FL03/rspm.git"
rust-version = "1.98.0"
version = "0.0.2"

[workspace.dependencies]

rspm = { default-features = false, path = "crates/rspm", version = "0.0.1" }
# local
# benchmarks
criterion = { features = ["plotters"], version = "0.8" }
# config
config = { features = [], version = "0.15" }
# clients
reqwest = { default-features = false, version = "0.13" }
sqlx = { default-features = false, features = ["derive", "macros"], version = "0.9" }
# crypto
base64 = { version = "0.23" }
hmac = { version = "0.13" }
k256 = { version = "0.13" }
rust_decimal = { version = "1" }
sha2 = { version = "0.11" }
# async
futures = { default-features = false, version = "0.3" }
tokio = { default-features = false, version = "1" }
tokio-tungstenite = { default-features = false, version = "0.30" }
# concurrency & parallelism
rayon = { default-features = false, version = "1" }
# data structures
bytes = { default-features = false, version = "1" }
hashbrown = { default-features = false, version = "0.17" }
url = { default-features = false, version = "2" }
# error handling
anyhow = { default-features = false, version = "1" }
thiserror = { default-features = false, version = "2" }
# math
num-traits = { default-features = false, version = "0.2" }
# rand
getrandom = { default-features = false, version = "0.4" }
rand = { default-features = false, version = "0.10" }
rand_distr = { default-features = false, version = "0.6" }
uuid = { default-features = false, version = "1" }
# time
chrono = { default-features = false, version = "0.4" }
time = { default-features = false, version = "0.3" }
# macros & utilities
lazy_static = { version = "1" }
paste = { version = "1" }
proc-macro2 = { version = "1" }
smart-default = { version = "0.7" }
static_assertions = { version = "1" }
strum = { default-features = false, features = ["derive"], version = "0.28" }
syn = { features = ["full", "parsing", "visit"], version = "3" }
# serialization
schemars = { default-features = false, features = ["derive"], version = "1" }
serde = { default-features = false, features = ["derive"], version = "1" }
serde_derive = { version = "1" }
serde_json = { default-features = false, version = "1" }
serde_path_to_error = { version = "0.1" }
# polymarket
polymarket_client_sdk_v2 = { path = "patches/polymarket_client_sdk_v2", version = "0.7" }
# WebAssembly
wasm-bindgen = { default-features = false, version = "0.2" }
# WebAssembly System Interface
wit-bindgen = { default-features = false, version = "0.61" }
# tracing
tracing = { default-features = false, features = ["attributes"], version = "0.1" }

[workspace.dependencies.tracing-subscriber]
default-features = false
features = [
  "env-filter",
  "fmt",
]
version = "0.3"

# ********* [Profiles] *********
[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 1
overflow-checks = true
panic = "unwind"
rpath = false
strip = false

[profile.release]
codegen-units = 16
debug = false
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 2
overflow-checks = false
panic = "unwind"
rpath = false
strip = true

[profile.android-dev]
inherits = "dev"

[profile.server-dev]
inherits = "dev"
lto = "thin"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = true

[profile.docker]
codegen-units = 4
inherits = "release"
lto = "thin"
